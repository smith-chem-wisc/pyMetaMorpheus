name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # release.yml calls this workflow on a tag rather than restating the matrix. Two copies of a
  # test matrix drift, and the copy that drifts is the one that only runs on release day — the
  # single occasion when nobody wants to discover that the gate they trusted was a stale duplicate.
  workflow_call:

jobs:
  # Offline suite — no MetaMorpheus CLI needed. Proves the package is pure-Python,
  # dependency-free, and cross-OS (Windows / Linux / macOS incl. Apple Silicon),
  # exactly the matrix pyMzLib runs.
  offline:
    name: offline (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        python-version: ["3.9", "3.12", "3.13"]
        exclude:
          # macos-14 (Apple Silicon) has no 3.9; cover arm64 on newer Pythons.
          - os: macos-14
            python-version: "3.9"
    defaults:
      run:
        working-directory: pkg/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, dev extras)
        run: python -m pip install -e ".[dev]"
      - name: No third-party runtime dependency
        # The core package must import with only the standard library present.
        run: python -c "import pymetamorpheus; print(pymetamorpheus.__version__)"
      - name: Offline tests
        run: python -m pytest -q -m "not live"

  # Live canary — builds a self-contained MetaMorpheus CLI on Linux (no .NET
  # pre-installed beyond the SDK used to publish) and runs a real search through
  # the Python API, proving the round-trip end to end.
  #
  # It builds the commit in code/metamorpheus.pin, NOT master. Until 2026-08-09 this
  # job ran `git clone --depth 1` of master, so the canary tested whatever MetaMorpheus
  # happened to be that morning while the wheel projected a commit from July — green
  # here said nothing about the build users would get, and a breaking upstream change
  # would have reddened CI on an unrelated pull request with no clue why.
  #
  # Pinning also makes the bump loop mean something: upstream-watch.yml proposes a new
  # pin as a pull request, this job runs against that pull request, and merging it is
  # therefore backed by a real search having succeeded on the new build.
  live:
    name: live (ubuntu, self-contained CLI at the pin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fetch MetaMorpheus at the pinned commit
        run: |
          set -euo pipefail

          # Validate before use, so a mangled pin fails naming itself instead of
          # surfacing as an inscrutable git error four lines later.
          pin=$(tr -d '[:space:]' < code/metamorpheus.pin)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::code/metamorpheus.pin must hold a full 40-character sha; got '$pin'"
            exit 1
          fi
          echo "pinned MetaMorpheus commit: $pin"

          # `clone --depth 1` can only reach a branch tip, and the pin deliberately is
          # not one (it sits 25 commits past 1.1.7 today, and after any bump it is a
          # release commit that master has already moved past). Fetching the sha
          # directly is shallow AND exact; GitHub allows it, verified 2026-08-09.
          mkdir mm && cd mm
          git init -q
          git remote add origin https://github.com/smith-chem-wisc/MetaMorpheus.git
          git fetch -q --depth 1 origin "$pin"
          git checkout -q FETCH_HEAD

          got=$(git rev-parse HEAD)
          if [ "$got" != "$pin" ]; then
            echo "::error::checked out $got but the pin is $pin"
            exit 1
          fi
      - name: Publish self-contained CLI (linux-x64)
        shell: pwsh
        run: |
          ./pkg/build/publish-runner.ps1 -Rid linux-x64 -MetaMorpheusRoot "$PWD/mm"
      - name: Install package
        working-directory: pkg/python
        run: python -m pip install -e ".[dev]"
      - name: Live tests (staged payload; no PYMM_METAMORPHEUS)
        working-directory: pkg/python
        env:
          # Point the sample-data fixture at the cloned MetaMorpheus data dir.
          PYMM_SAMPLE_DATA: ${{ github.workspace }}/mm/MetaMorpheus/EngineLayer/Data
        run: python -m pytest -q -m live
