name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# gh-deploy pushes the built site to the gh-pages branch.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs toolchain + package
        # The package must be importable for mkdocstrings to build the API
        # reference; it's zero-dependency, so this is quick. The [docs] extra
        # pulls in mkdocs, mkdocs-material, and mkdocstrings[python].
        run: python -m pip install -e "pkg/python[docs]"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and deploy to GitHub Pages
        run: python -m mkdocs gh-deploy --force --strict
