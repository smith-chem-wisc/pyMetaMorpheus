# What a tag is allowed to mean.
#
# This file starts with one job: proving the tag being released and the version the package
# declares are the same string. Building and attaching the artefacts comes next, and hangs off
# this job — so a typo in a tag costs seconds instead of producing a mislabelled artefact.
#
# Why that is worth a whole job: cutting `v0.1.0.dev4` on the sibling project while the package
# still said `dev3` would have built wheels named `dev3`, attached them to a release page headed
# `dev4`, and gone entirely green. Nothing in the pipeline compares those two strings unless
# something is written to compare them. PyPI never lets a version number be reused, so the
# resulting artefact can only be yanked and superseded, never corrected.

name: release

on:
  push:
    tags: ["v*"]
  # Dispatch is deliberately allowed. GitHub lets you dispatch against a tag as well as a branch,
  # so this job is reachable that way; dispatched from a branch it simply skips, because there is
  # no tag to check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag-matches-version:
    name: tag matches the declared version
    # No `needs:`. This is the cheapest thing in the pipeline and the most expensive to get wrong,
    # so it runs first and alone.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare the tag with the package's version
        working-directory: pkg/python
        run: |
          set -euo pipefail

          tag="${GITHUB_REF#refs/tags/}"
          want="${tag#v}"

          # Read __version__ without importing the package: an import would execute __init__.py,
          # which imports the whole API surface, so an unrelated breakage would surface here as a
          # confusing version failure.
          got=$(python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("src/pymetamorpheus/__init__.py").read_text(encoding="utf-8")
          m = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', text, re.M)
          if not m:
              sys.exit("no __version__ assignment found in src/pymetamorpheus/__init__.py")
          print(m.group(1))
          PY
          )

          echo "tag:              $tag"
          echo "tag minus 'v':    $want"
          echo "__version__:      $got"

          if [ "$want" != "$got" ]; then
            echo "::error::tag $tag declares version '$want' but the package says '$got'. Bump src/pymetamorpheus/__init__.py, or retag."
            exit 1
          fi

      - name: The version must still have exactly one source
        working-directory: pkg/python
        run: |
          set -euo pipefail

          # pyproject.toml derives the version from __init__.py. If someone reintroduces a static
          # `version = "..."` under [project], hatchling errors at build time — but that failure
          # appears late, inside a build log, wearing a packaging error's clothes. Say it here
          # instead, where the message can name what actually went wrong.
          python - <<'PY'
          import sys, tomllib, pathlib

          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          project = cfg["project"]

          if "version" in project:
              sys.exit(
                  "pyproject.toml declares a static [project] version again. The version has one "
                  "home: __version__ in src/pymetamorpheus/__init__.py. Two copies is how a release "
                  "ends up named one thing and labelled another."
              )
          if "version" not in project.get("dynamic", []):
              sys.exit("pyproject.toml must list 'version' in [project] dynamic.")

          path = cfg["tool"]["hatch"]["version"]["path"]
          if path != "src/pymetamorpheus/__init__.py":
              sys.exit(f"[tool.hatch.version] path points at {path}, not the package's __init__.py.")

          print("version has exactly one source:", path)
          PY

  # The full CI matrix, called rather than restated: four operating systems, three Pythons, plus
  # the live canary that builds a self-contained MetaMorpheus CLI from code/metamorpheus.pin and
  # runs a real search through it. Nothing is built for release until that has passed on the exact
  # commit being tagged.
  ci:
    name: ci
    needs: tag-matches-version
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    name: build the wheel
    needs: [tag-matches-version, ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        working-directory: pkg/python
        run: |
          set -euo pipefail
          python -m pip install --quiet build
          python -m build --wheel --outdir dist .
          ls -lh dist

      # A wheel whose name does not match the tag would mean the gate above passed and something
      # downstream still produced the wrong thing. Cheap to check, and it checks the actual
      # artefact rather than the intent.
      - name: The built filename must carry the tagged version
        working-directory: pkg/python
        run: |
          set -euo pipefail
          want="${GITHUB_REF#refs/tags/v}"
          if ! ls dist/pymetamorpheus-"$want"-*.whl >/dev/null 2>&1; then
            echo "::error::no wheel named for version $want; built: $(ls dist)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: pkg/python/dist/*.whl
          if-no-files-found: error

  # No PYPI_PUBLISH gate here, deliberately. While the package is not on PyPI the GitHub Release is
  # the only way to get a build, so it must run on every v* tag. The sibling project shipped a
  # release page advertising wheels that were never uploaded, because attaching them was a manual
  # step — and manual steps get skipped.
  github-release:
    name: attach the wheel to the GitHub Release
    needs: [tag-matches-version, ci, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: List what will be attached
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          # A tag with no matching wheel means an upstream job silently produced nothing. Fail
          # loudly rather than succeed with an empty release page.
          fail_on_unmatched_files: true
          # Keep dev previews out of "Latest".
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  # Publish via Trusted Publishing — no stored API token; PyPI verifies this workflow's OIDC
  # identity instead.
  #
  # Two gates, both required. The tag gate is obvious. The PYPI_PUBLISH repository-variable gate is
  # a safety switch, because PyPI cannot accept an upload from this project yet and would not be
  # able to even if the plumbing were perfect:
  #
  #   1. No Trusted Publisher is registered for this workflow on PyPI (a one-time manual step).
  #   2. pyproject.toml's [pymzlib] extra is a direct git reference, and PyPI rejects any
  #      distribution whose metadata carries one. That reference is itself provisional — it exists
  #      because pyMzLib is not on PyPI and an unrelated package already holds the name `pymzlib`.
  #   3. The shipping model for the MetaMorpheus CLI payload is still open (gap G-dist). A wheel
  #      built here today carries NO CLI: it installs fine and then needs PYMM_METAMORPHEUS or a
  #      locally staged payload to do anything. That is fine for a rehearsal on a dev tag and is
  #      not something to put on a public index.
  #
  # So a v* tag builds, tests and rehearses everything; it just does not ship. Turn shipping on by
  # setting the repository variable PYPI_PUBLISH=true (Settings -> Secrets and variables ->
  # Actions -> Variables) once the three items above are resolved.
  pypi:
    name: publish to PyPI
    needs: [tag-matches-version, ci, build]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymetamorpheus
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the artifacts before anything is published
        run: |
          set -euo pipefail
          pip install --quiet twine
          ls -lh dist
          twine check --strict dist/*.whl

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: false
