# Notices when MetaMorpheus cuts a release, and opens the pull request that bumps our pin to it.
#
# Before this existed, nothing connected a MetaMorpheus release to this package. The pin moved only
# when a human remembered to move it, and a user holding a wheel had no way to find out that the
# search engine inside it was three releases behind.
#
# What this does NOT do is push the bump. It opens a pull request, because ci.yml runs on
# `pull_request` and its live canary — build a self-contained CLI from the pinned commit, run a real
# search through the Python API — is precisely the evidence needed to decide whether a new
# MetaMorpheus is safe to build against. Bumping by push would skip the one check that makes the
# bump trustworthy.

name: upstream-watch

on:
  schedule:
    # Mondays, 07:00 UTC. MetaMorpheus releases every few months (1.1.7 was 2026-05-07), so anything
    # more frequent is noise; the workflow is a no-op on a week with no new release and costs two API
    # calls to find that out.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Least privilege: enough to push a branch and open a pull request against this repository, nothing
# more. Note this workflow deliberately touches NO file under .github/workflows/ — GitHub rejects a
# push from the default GITHUB_TOKEN that modifies one. That constraint is why the pin lives in a
# plain file (code/metamorpheus.pin) rather than an `env:` entry in a workflow.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  metamorpheus:
    name: check MetaMorpheus for a new release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `secrets` context is not available in a step's `if:` — only in `env:` and `with:`. So
      # whether a PAT is configured has to become an ordinary output here before anything downstream
      # can branch on it.
      - name: Note whether a PAT is configured
        id: pat
        env:
          UPSTREAM_WATCH_TOKEN: ${{ secrets.UPSTREAM_WATCH_TOKEN }}
        run: |
          if [ -n "${UPSTREAM_WATCH_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve MetaMorpheus's latest release to a commit
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # `releases/latest` excludes drafts and prereleases, which is what we want: the pin should
          # follow what MetaMorpheus considers shipped, not whatever tag exists.
          tag=$(gh api repos/smith-chem-wisc/MetaMorpheus/releases/latest --jq .tag_name)

          # If the tag is ANNOTATED, `git/ref/tags/<tag>` returns the sha of the tag OBJECT rather
          # than of the commit it points at — a subtle wrong answer that looks like a valid sha and
          # would pin the build to something `git checkout` cannot resolve to a tree. The commits
          # endpoint dereferences, and also works for lightweight tags.
          sha=$(gh api repos/smith-chem-wisc/MetaMorpheus/commits/"$tag" --jq .sha)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "MetaMorpheus's latest release is $tag ($sha)"

      - name: Compare it with our pin
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          # Validate before comparing, so a mangled pin fails naming itself rather than looking like
          # a legitimate difference and producing a confident, wrong pull request.
          pin=$(tr -d '[:space:]' < code/metamorpheus.pin)
          if ! [[ "$pin" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::code/metamorpheus.pin must hold a full 40-character sha; got '$pin'"
            exit 1
          fi
          echo "current pin: $pin"

          if [ "$pin" = "$NEW_SHA" ]; then
            echo "Already pinned to $NEW_TAG. Nothing to do."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Direction matters, and this is not hypothetical here: the pin sits 25 commits AHEAD of
          # 1.1.7 and did so deliberately. In that state the honest report is "nothing to do", not a
          # pull request that rolls the build backwards onto an older MetaMorpheus. `.status` is
          # relative to the base, so with base=pin and head=release it reads "ahead" only when the
          # release genuinely contains commits the pin does not.
          status=$(gh api repos/smith-chem-wisc/MetaMorpheus/compare/"$pin"..."$NEW_SHA" --jq .status)
          echo "release is '$status' relative to the pin"

          if [ "$status" != "ahead" ]; then
            echo "::notice::MetaMorpheus $NEW_TAG is '$status' relative to the current pin; leaving the pin alone."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api repos/smith-chem-wisc/MetaMorpheus/compare/"$pin"..."$NEW_SHA" \
            --jq '.commits[] | "- `\(.sha[0:8])` \(.commit.message | split("\n")[0])"' > /tmp/commits.md
          echo "commits between the pin and $NEW_TAG:"
          cat /tmp/commits.md

          echo "action=bump" >> "$GITHUB_OUTPUT"

      - name: Bump the pin and record why
        if: steps.pin.outputs.action == 'bump'
        env:
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEW_SHA" > code/metamorpheus.pin

          # One row appended to the end of PINNED.md, which is why that file's pin-history table is
          # required to be the last thing in it. Appending is the only edit this workflow makes to
          # prose: rewriting a paragraph mechanically is how a document ends up asserting something
          # nobody wrote and nobody checked.
          today=$(date -u +%Y-%m-%d)
          short=$(printf '%s' "$NEW_SHA" | cut -c1-8)
          printf '| %s | `%s` | `%s` | tracked automatically by `upstream-watch.yml`; see the pull request for the commits it brought in |\n' \
            "$today" "$short" "$NEW_TAG" >> code/PINNED.md

      - name: Compose the pull request body
        if: steps.pin.outputs.action == 'bump'
        id: body
        env:
          NEW_SHA: ${{ steps.upstream.outputs.sha }}
          NEW_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "MetaMorpheus released **$NEW_TAG**, which is ahead of the commit this package"
            echo "projects. This bumps \`code/metamorpheus.pin\` to \`$NEW_SHA\`."
            echo
            echo "### What it brings in"
            echo
            cat /tmp/commits.md
            echo
            echo "### What to look at before merging"
            echo
            echo "CI's live canary builds a self-contained CLI **from this pin** and runs a real"
            echo "search through the Python API, so a green tick here means the new MetaMorpheus"
            echo "builds and the round trip still works."
            echo
            echo "What CI cannot judge is whether any commit above **changes a value MetaMorpheus"
            echo "reports**. A pure projection is routine; a changed number is a judgement call."
            echo "Skim the list with that in mind."
            echo
            echo "Also worth checking: the grounding facts in \`code/PINNED.md\` — the \`CMD -g\`"
            echo "output, the task-type names, the \`Task<N><TaskType>Task/\` output folders, the"
            echo "TOML section names. Those are what this package encodes, nothing else in the"
            echo "repository holds them, and a range that touches the CMD or task surface is"
            echo "exactly what changes one silently."
            echo
            echo "---"
            echo "Opened by \`.github/workflows/upstream-watch.yml\`."
          } > /tmp/body.md
          cat /tmp/body.md
          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"

      - name: Open (or update) the bump pull request
        if: steps.pin.outputs.action == 'bump'
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          # A PAT is used when one is configured, and the default token otherwise. What that buys is
          # narrower than it looks: a pull request opened by GITHUB_TOKEN DOES get its checks queued,
          # but they land at `action_required`, held behind GitHub's approval gate because the author
          # is github-actions[bot] and the repository treats that as a first-time contributor. The
          # checks exist; they need one click.
          #
          # So the PAT does not add missing checks. It makes the pull request come from a human
          # account, which is what removes the gate and lets CI start on its own. Nothing breaks
          # without it — the bump just waits for someone to press the button.
          token: ${{ secrets.UPSTREAM_WATCH_TOKEN || github.token }}
          # Reuse the branch across re-runs so a weekly cron updates one pull request per
          # MetaMorpheus release rather than opening a duplicate every Monday until it is merged.
          branch: upstream/metamorpheus-${{ steps.upstream.outputs.tag }}
          title: "chore(metamorpheus): bump the pin to ${{ steps.upstream.outputs.tag }}"
          body-path: ${{ steps.body.outputs.path }}
          commit-message: |
            chore(metamorpheus): bump the pin to ${{ steps.upstream.outputs.tag }}

            MetaMorpheus released ${{ steps.upstream.outputs.tag }}; code/metamorpheus.pin now
            points at ${{ steps.upstream.outputs.sha }}. Opened by upstream-watch.yml.
          labels: upstream
          delete-branch: true

      - name: Say what still needs a human
        if: steps.pin.outputs.action == 'bump' && steps.pat.outputs.configured == 'false'
        run: |
          echo "::notice::Opened the bump pull request. Its checks are held for approval because the author is github-actions[bot] — click 'Approve workflows to run' on the pull request. Set UPSTREAM_WATCH_TOKEN to skip that step."
