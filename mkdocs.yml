site_name: pyMetaMorpheus
site_description: MetaMorpheus, callable from Python — dependency-free.
site_url: https://smith-chem-wisc.github.io/pyMetaMorpheus/
repo_url: https://github.com/smith-chem-wisc/pyMetaMorpheus
repo_name: smith-chem-wisc/pyMetaMorpheus
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting started: guides/getting-started.md
  - Guides:
      - Getting your data (PRIDE & UniProt): guides/getting-data.md
      - Classic search: guides/search.md
      - Calibration, GPTMD, glyco & pipelines: guides/tasks.md
      - Full parameter access: guides/full-access.md
      - Results & output files: guides/results.md
      - Installation & locating the CLI: guides/installation.md
  - API reference: reference.md
  - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
