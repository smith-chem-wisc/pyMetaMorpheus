[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymetamorpheus"
# The version is NOT written here. It is read from src/pymetamorpheus/__init__.py
# (see [tool.hatch.version] below), so the value exists exactly once and cannot
# disagree with itself. It used to be declared in both places: two strings that
# a release could set half of, producing a wheel named one thing and attached to
# a release page headed another, entirely green. PyPI never lets a version be
# reused, so that mistake can only be yanked and superseded, never corrected.
dynamic = ["version"]
description = "MetaMorpheus, callable from Python — a dependency-free, faithful projection of the MetaMorpheus CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Smith Lab (UW-Madison)" }]
keywords = ["proteomics", "mass-spectrometry", "metamorpheus", "mzlib", "search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]

# ZERO third-party runtime dependencies (decision D2). The package drives a
# self-contained MetaMorpheus CLI via the standard library only. Everything a
# user could want beyond that is an optional extra, never a hard requirement.
dependencies = []

[project.optional-dependencies]
# Rich, parsed result tables come from mzLib's own readers via pyMzLib — compose,
# don't re-parse (gap G-parse, Option 2). Optional so the core stays dep-free.
# PROVISIONAL: pyMzLib is not on PyPI yet, and an UNRELATED package named
# `pymzlib` exists there — so we point at the real one by VCS. Once the Smith-lab
# pyMzLib is published to PyPI, replace this with a plain version pin (tracked
# with gap G-dist). A direct URL here intentionally blocks PyPI upload until then.
pymzlib = ["pymzlib @ git+https://github.com/smith-chem-wisc/pyMzLib#subdirectory=pkg/python"]
# Convenience DataFrame conversion for notebook users.
pandas = ["pandas"]
# Dev/test toolchain.
dev = ["pytest>=7", "pytest-cov"]
# Docs site toolchain (mkdocs build + auto API reference).
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/smith-chem-wisc/pyMetaMorpheus"
Source = "https://github.com/smith-chem-wisc/pyMetaMorpheus"
"MetaMorpheus" = "https://github.com/smith-chem-wisc/MetaMorpheus"

[tool.hatch.metadata]
# The [pymzlib] extra uses a git direct reference (pyMzLib isn't on PyPI yet, and
# a same-named unrelated package is). Hatchling validates every extra at metadata
# time — even ones not being installed — so this must be enabled or `pip install`
# of ANY extra fails. Provisional: drop the direct ref (and this flag) once
# pyMzLib is on PyPI (gap G-dist).
allow-direct-references = true

[tool.hatch.version]
# The single source of the version. `__version__` in the package is the value a
# user can actually read at runtime, so it is the one that must be true; the
# distribution metadata is derived from it rather than maintained beside it.
path = "src/pymetamorpheus/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymetamorpheus"]

# The self-contained CLI payload is staged into src/pymetamorpheus/_dotnet/ at
# build time (gitignored; see pkg/build/publish-runner.ps1 and gap G-dist). It is
# NOT committed. Because the payload can exceed PyPI's 100 MB per-file limit, the
# shipping model is likely download-at-install rather than bundling — decided in
# G-dist before the first release.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that invoke the real MetaMorpheus CLI (needs PYMM_METAMORPHEUS).",
]
